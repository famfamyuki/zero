# Trusted-project defaults; explicit session/administrator settings take precedence.
model = "gpt-6-astra"
model_reasoning_effort = "low"
model_reasoning_summary = "concise"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "user"

# Astra is the default single executor for repository work. Multi-agent execution
# is opt-in only when a bounded task has evidence that delegation is worth the
# extra context/tool cost.
[agents]
enabled = false

[features]
multi_agent_v2 = false
skill_mcp_dependency_install = false

[sandbox_workspace_write]
network_access = false

[shell_environment_policy]
ignore_default_excludes = false
