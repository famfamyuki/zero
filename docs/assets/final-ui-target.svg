  <text x="800" y="978" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">CONCEPTUAL LONG-TERM VISUAL REFERENCE — NOT CURRENT SPRINT SCOPE OR IMPLEMENTATION SPECIFICATION</text>
